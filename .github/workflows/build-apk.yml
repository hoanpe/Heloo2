name: Build BlockCraft 3D Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP if uploaded from mobile
        run: |
          if [ -f "blockcraft_3d_engine_and_apk_project.zip" ]; then
            unzip -o blockcraft_3d_engine_and_apk_project.zip
          fi
          if [ -d "android_studio_apk_project" ] && [ ! -f "settings.gradle" ]; then
            cp -r android_studio_apk_project/* .
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCraft3D-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
